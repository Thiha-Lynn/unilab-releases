# Include only within the canonical UniLab HTTPS server. Separate from app releases.
location = /usage { return 301 /usage/; }
location = /usage/ { rewrite ^ /usage/index.html last; }
location = /usage/index.html {
    alias /var/lib/unilab-public-usage/index.html;
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex";
    include snippets/unilab-headers.conf;
    access_log off;
}
location = /usage/data.json {
    alias /var/lib/unilab-public-usage/data.json;
    add_header Cache-Control "no-store";
    include snippets/unilab-headers.conf;
    access_log off;
}
location = /usage/daily.csv {
    alias /var/lib/unilab-public-usage/daily.csv;
    add_header Cache-Control "no-store";
    add_header Content-Disposition 'attachment; filename="unilab-daily-usage.csv"';
    include snippets/unilab-headers.conf;
    access_log off;
}
location /usage/ { return 404; }
